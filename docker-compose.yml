# RecallGuard data sources (AGENTS.md §4, §6).
# Live mode needs the Zetaris stack running first: it creates the network zetaris_default.
# Passwords are not interpolated with :? so the sample profile works with no .env (judges' path).
#   docker compose --profile db up -d                         # databases only
#   docker compose --profile live up -d                       # + supplier API + app
#   docker compose --profile sample up --build                # judges: API :8000 + UI :8501, no Zetaris, no creds

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  environment: &pg-env
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-}  # required for live mode; postgres refuses to start without it
    PG_READER_USER: ${PG_READER_USER:-zetaris_reader}
    PG_READER_PASSWORD: ${PG_READER_PASSWORD:-}  # checked in docker/postgres-init/01-reader.sh
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10
  networks: [zetaris]

services:
  rg-inventory:
    <<: *postgres
    profiles: [live, db]   # never started by the sample profile; naming the service still starts it
    container_name: rg-inventory
    environment:
      <<: *pg-env
      POSTGRES_DB: inventory
    ports: ["5433:5432"]
    volumes:
      - rg-inventory-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  rg-pos:
    <<: *postgres
    profiles: [live, db]   # never started by the sample profile; naming the service still starts it
    container_name: rg-pos
    environment:
      <<: *pg-env
      POSTGRES_DB: pos
    ports: ["5434:5432"]
    volumes:
      - rg-pos-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  rg-regulator:
    <<: *postgres
    profiles: [live, db]   # never started by the sample profile; naming the service still starts it
    container_name: rg-regulator
    environment:
      <<: *pg-env
      POSTGRES_DB: regulator
    ports: ["5435:5432"]
    volumes:
      - rg-regulator-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  rg-supplier-api:
    profiles: [live]
    container_name: rg-supplier-api
    build: ./services/supplier_api
    restart: unless-stopped
    ports: ["8001:8000"]
    volumes:
      - ./data/sample:/data/sample:ro
    networks: [zetaris]

  app:
    profiles: [live]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      ZETARIS_REST_URL: http://host.docker.internal:8888/api/v1.0
      METERLESS_BASE_URL: http://host.docker.internal:8088/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${PORT:-8000}:8000"]
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    depends_on:
      rg-inventory: { condition: service_healthy }
      rg-pos: { condition: service_healthy }
      rg-regulator: { condition: service_healthy }
    networks: [zetaris]

  # Judges' path: no .env, no Zetaris network, no network calls.
  app-sample:
    profiles: [sample]
    build: .
    environment:
      SAMPLE_MODE: "true"
    ports: ["${PORT:-8000}:8000"]
    volumes:
      - ./logs:/app/logs
    networks: [internal]

  # Streamlit UI (Part C). Talks only to the API above.
  ui:
    profiles: [live]
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_URL: http://app:8000
    ports: ["8501:8501"]
    healthcheck: { disable: true }
    depends_on: [app]
    networks: [zetaris]

  ui-sample:
    profiles: [sample]
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_URL: http://app-sample:8000
    ports: ["8501:8501"]
    healthcheck: { disable: true }
    depends_on: [app-sample]
    networks: [internal]

networks:
  zetaris:
    name: zetaris_default
    external: true
  internal: {}

volumes:
  rg-inventory-data:
  rg-pos-data:
  rg-regulator-data:
